name: ML Training Jobs (Every 3 Days)

on:
  schedule:
    - cron: "0 2 */3 * *"   # every 3rd day at 2 AM UTC
  workflow_dispatch:

jobs:
  run-ml-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd ML
          pip install -r requirements.txt

      - name: Run ML Jobs
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
          API_KEY_GENAI: ${{ secrets.API_KEY_GENAI }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          cd ML
          python jobs/daily_jobs.py
          